<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>跳转网球记</title>
  <!-- 不依赖 JS 的跳转方式 -->
  <meta http-equiv="refresh" content="0; url=#小程序://网球记赛事/{EVENT_ID}">
</head>
<body>
  <noscript>
    <p>请在微信中打开此页面</p>
  </noscript>
  <script>
    // 尝试 JS 跳转
    const params = new URLSearchParams(location.search);
    const eventId = params.get('id') || '';
    if (eventId) {
      window.location.replace('#小程序://网球记赛事/' + eventId);
    }
  </script>
</body>
</html>
