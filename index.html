<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>跳转网球记小程序</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f5f5f5; }
    .container { text-align: center; padding: 32px; max-width: 420px; }
    .card { background: white; border-radius: 20px; padding: 40px 32px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
    .icon { font-size: 56px; margin-bottom: 16px; }
    h1 { font-size: 22px; color: #333; margin-bottom: 8px; }
    .sub { font-size: 14px; color: #999; margin-bottom: 24px; }
    .btn { display: inline-block; background: #07c160; color: white; padding: 14px 36px; border-radius: 28px; text-decoration: none; font-size: 16px; font-weight: 600; box-shadow: 0 4px 12px rgba(7,193,96,0.3); transition: transform 0.1s; }
    .btn:active { transform: scale(0.97); }
    .hint { margin-top: 24px; background: #fffbe6; border-radius: 12px; padding: 16px; font-size: 13px; color: #776d4a; text-align: left; line-height: 1.7; }
    .hint strong { color: #594d2a; }
    .loading { font-size: 14px; color: #999; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="icon">🎾</div>
      <h1>网球记</h1>
      <p class="sub" id="event-name">正在打开小程序...</p>
      <a id="open-btn" class="btn" href="#" onclick="openWechat()">打开小程序报名</a>
      <p class="loading" id="loading" style="display:none">正在跳转...</p>
    </div>
    <div class="hint" id="hint" style="display:none">
      <strong>💡 操作提示：</strong><br>
      如果按钮未能跳转，请在微信中搜索「网球记」小程序，<br>
      或联系赛事组织方获取报名方式。
    </div>
  </div>

  <script>
    const WX_APPID = 'wxf0da833fc86de8b3';
    const params = new URLSearchParams(location.search);
    const eventId = params.get('id') || '';
    const eventName = params.get('name') || '网球记赛事';

    // 显示赛事名称
    document.getElementById('event-name').textContent = decodeURIComponent(eventName);

    function openWechat() {
      // 构建微信小程序 scheme URL
      // pages/share/calendar 是分享日历页面
      const page = 'pages/share/calendar';
      const query = eventId ? `id=${eventId}` : '';
      const ticket = encodeURIComponent(query ? `${page}?${query}` : page);
      const wechatUrl = `weixin://dl/business/?t=${ticket}`;
      
      // 直接跳转
      window.location.href = wechatUrl;
      
      // 显示加载提示
      document.getElementById('loading').style.display = 'block';
      document.getElementById('open-btn').style.display = 'none';
      
      // 2秒后显示提示（如果还在本页）
      setTimeout(() => {
        document.getElementById('hint').style.display = 'block';
        document.getElementById('loading').style.display = 'none';
      }, 2000);
    }

    // 页面加载后自动尝试跳转
    window.addEventListener('load', () => {
      // 延迟一点跳转，避免被浏览器拦截
      setTimeout(openWechat, 300);
    });
  </script>
</body>
</html>
